# KCTF Platform Nginx 설정 파일
# 역할: 역방향 프록시로 Next.js 앱에 요청 전달, secure_link로 파일 다운로드 보호
# 설치: sudo cp nginx/conf.d/default.conf /etc/nginx/conf.d/kctf.conf
# 설정 후: sudo nginx -t && sudo systemctl reload nginx

upstream kctf_backend {
    server localhost:3000;
    # 또는 Docker 네트워크를 사용하는 경우: server kctf-web:3000;
}

server {
    listen 80;
    server_name your-domain.com;  # 실제 도메인으로 변경하세요

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Proxy to Next.js app
    location / {
        proxy_pass http://kctf_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_buffering off;
    }

    # Secure file download with secure_link
    location /files/ {
        secure_link $arg_md5,$arg_expires;
        secure_link_md5 "$secure_link_expires$uri$remote_addr secret";

        if ($secure_link = "") {
            return 403;
        }

        if ($secure_link = "0") {
            return 410;
        }

        alias /var/www/files/;

        # Prevent execution of scripts
        location ~* \.(php|cgi|pl|py|sh|lua)$ {
            return 403;
        }

        # Security headers for file downloads
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Disposition "attachment" always;
    }

    # Health check endpoint
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}

