services:
  postgres:
    image: postgres:16-alpine
    container_name: kctf-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - kctf-postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 8
    security_opt:
      - no-new-privileges:true
    networks:
      - kctf-internal

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: kctf-platform
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@127.0.0.1:5432/${POSTGRES_DB}
      NEXTAUTH_URL: https://ctf.jjw0-0.kr
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      AUTH_SECRET: ${NEXTAUTH_SECRET}
      AUTH_TRUST_HOST: "true"
      INSTANCER_URL: http://127.0.0.1:7000
      INSTANCER_TOKEN: ${KCTF_INSTANCER_TOKEN:-}
      FLAG_SECRET: ${NEXTAUTH_SECRET}
      PORT: ${KCTF_HOST_PORT:-3020}
      HOSTNAME: 127.0.0.1
    network_mode: host
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3020/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    profiles: ["tools"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      FLAG_SECRET: ${NEXTAUTH_SECRET}
    command: ["npx", "prisma", "migrate", "deploy"]
    depends_on:
      postgres:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    networks:
      - kctf-internal

volumes:
  kctf-postgres-data:

networks:
  kctf-internal:
    driver: bridge
