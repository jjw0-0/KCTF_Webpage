# Host Nginx example. Replace the domain and certificate paths.
log_format kctf_json escape=json '{'
  '"ts":$msec,'
  '"status":$status,'
  '"duration":$request_time,'
  '"actor":"$upstream_http_x_kctf_actor",'
  '"request":{'
    '"remote_ip":"$remote_addr",'
    '"method":"$request_method",'
    '"host":"$host",'
    '"uri":"$request_uri",'
    '"headers":{"User-Agent":["$http_user_agent"]}'
  '}'
'}';

map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

server {
  listen 80;
  server_name ctf.example.com;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl;
  http2 on;
  server_name ctf.example.com;

  ssl_certificate /etc/letsencrypt/live/ctf.example.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/ctf.example.com/privkey.pem;

  access_log /var/log/kctf/access.jsonl kctf_json;
  add_header Strict-Transport-Security "max-age=0" always;
  add_header X-Content-Type-Options "nosniff" always;

  location / {
    proxy_pass http://127.0.0.1:3333;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
  }
}
