name: Release images

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: release-images
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require successful CI for this Master revision
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$GITHUB_REF" = refs/heads/Master
          count=$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs" \
            -f branch=Master -f head_sha="$GITHUB_SHA" -f event=push -f status=success -f per_page=1 \
            --jq '.total_count')
          test "$count" -ge 1 || { echo "A successful Master push CI run is required for $GITHUB_SHA." >&2; exit 1; }

  images:
    needs: verify
    if: github.ref == 'refs/heads/Master'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: release
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: web
            context: .
            dockerfile: Dockerfile
          - image: instancer
            context: services/instancer
            dockerfile: services/instancer/Dockerfile
    steps:
      - uses: actions/checkout@v7
      - id: names
        run: echo "image_prefix=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.names.outputs.image_prefix }}-${{ matrix.image }}:${{ github.sha }}
