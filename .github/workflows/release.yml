name: Release images

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-images
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  images:
    needs: verify
    if: github.ref == 'refs/heads/Master'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: release
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: web
            context: .
            dockerfile: Dockerfile
          - image: instancer
            context: services/instancer
            dockerfile: services/instancer/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - id: names
        run: echo "image_prefix=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.names.outputs.image_prefix }}-${{ matrix.image }}:${{ github.sha }}
