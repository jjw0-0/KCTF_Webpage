name: CI

on:
  workflow_call:
  pull_request:
  push:
    branches: [Master]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run prisma:generate
      - run: npm run lint
      - run: npm run type-check
      - run: npm test
      - run: npm run build
        env:
          AUTH_SECRET: ci-build-only-secret-keep-out-of-production
          DATABASE_URL: postgresql://kctf_test:kctf_test@127.0.0.1:5433/kctf_test
      - run: npm audit --omit=dev --audit-level=moderate
      - run: npm ci
        working-directory: services/instancer
      - run: npm test
        working-directory: services/instancer
      - run: npm audit --omit=dev --audit-level=moderate
        working-directory: services/instancer

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: kctf_test
          POSTGRES_PASSWORD: kctf_test
          POSTGRES_DB: kctf_test
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U kctf_test -d kctf_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql://kctf_test:kctf_test@127.0.0.1:5433/kctf_test
      AUTH_SECRET: ci-browser-only-secret-keep-out-of-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run prisma:generate
      - run: npx prisma migrate deploy
      - run: npm run test:e2e:seed
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7
