# Docker Compose 설정 파일
# 여러 Docker 컨테이너(PostgreSQL, Next.js)를 한 번에 실행하고 관리

services:
  postgres:
    image: postgres:16-alpine
    container_name: kctf-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - kctf-network

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: kctf-web
    restart: unless-stopped
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - NEXTAUTH_URL=${NEXTAUTH_URL}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - INSTANCER_URL=http://instancer:7000
      - INSTANCER_TOKEN=${KCTF_INSTANCER_TOKEN}
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
      - file-storage:/app/public/files
    ports:
      - "${APP_PORT}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      instancer:
        condition: service_healthy
    networks:
      - kctf-network
    command: npm run dev

  instancer:
    build:
      context: ./services/instancer
    restart: unless-stopped
    environment:
      INSTANCER_TOKEN: ${KCTF_INSTANCER_TOKEN}
      INSTANCER_PUBLIC_HOST: ${INSTANCER_PUBLIC_HOST:-127.0.0.1}
      INSTANCER_DATA_DIR: /var/lib/kctf-instancer
      INSTANCER_TTL_MS: ${INSTANCER_TTL_MS:-3600000}
      INSTANCER_PORT_MIN: ${INSTANCER_PORT_MIN:-10000}
      INSTANCER_PORT_MAX: ${INSTANCER_PORT_MAX:-19999}
      INSTANCER_INSTALL_AMD64_EMULATION: ${INSTANCER_INSTALL_AMD64_EMULATION:-true}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/kctf-instancer:/var/lib/kctf-instancer
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:7000/healthz"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks:
      - kctf-network

volumes:
  postgres-data:
    driver: local
  file-storage:
    driver: local

networks:
  kctf-network:
    driver: bridge
